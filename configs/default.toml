# Vineliner run configuration: defaults agreed in PROJECT.md §12.
#
# Keys marked OPEN are deliberately left unset (PROJECT.md §15). A run must set
# them explicitly; tools.config.RunSettings refuses to start and lists every
# missing key. Nothing is filled in silently.
#
# Every run records the exact configuration it used next to its outputs.
#
# Run settings go in their own file, named after what they set (e.g.
# configs/centroid-pretest.toml). That file only needs the keys it changes; it
# is merged on top of this one, and may itself `extends = "other.toml"`:
#     python src/run_pipeline.py configs/centroid-pretest.toml
# Relative paths are relative to the project root.

[input]                         # §3, §14: set per area
# rgb =                         # path to the RGB GeoTIFF
# rgb_bands =                   # band meaning in file order, e.g. ["red", "green", "blue"]
# nir =                         # optional path to a false-colour NIR GeoTIFF on the same grid
# nir_bands =                   # band meaning in file order, e.g. ["nir", "red", "green"]
# ndvi =                        # optional single-band NDVI GeoTIFF on the same grid (its own NoData applies)
# nodata_value =                # value treated as NoData or outlier; unset = the file's NoData
nodata_rule = "any_band"        # mask a pixel when ANY band of ANY input file equals nodata_value
                                # ("all_bands": only when every band of one file does)

[vineyards]                     # §4: block polygons; automatic classification is OPEN
# source =                      # polygon file (GeoPackage, shapefile, ...)
# layer =                       # optional layer name
# id_field =                    # optional id attribute; unset = 0, 1, ... in file order
# blocks =                      # optional subset of block ids to process

[evidence]                      # §5: row-evidence raster V in [0, 1], high = row
# method =                      # OPEN: "gray_stretch" | "black_tophat"
bands = ["red", "green", "blue"]  # averaged to gray; names from rgb_bands / nir_bands
# tophat_size_m =               # OPEN for black_tophat: closing window side
scale_percentile = 99.0         # top-hats: this percentile of the response maps to V = 1
stretch_percentiles = [2.0, 98.0]  # stretches: lo/hi percentiles
# scale_region =                # OPEN: "per_block" (each block scaled on its own) | "all_blocks"
ndvi_weight = 0.0               # share of an NDVI component in V; 0 = RGB-only (PROJECT.md §2, §5)
# ndvi_method =                 # needed when ndvi_weight > 0: "white_tophat" | "stretch"
# ndvi_tophat_size_m =          # needed for white_tophat

[template]                      # §6
indices = [-2, -1, 0, 1, 2]     # outer left ... outer right
weights = [0.05, 0.20, 0.50, 0.20, 0.05]  # must sum to 1.00
# line_length_m =               # OPEN: 1.0, 2.0 or nominal spacing discussed
band_width_px = 1               # kernel sampling width, not a row width; must be > 0

[kernels]                       # §6.1
coverage = "exact"              # "exact" | "sampled" (fractional); "centre" | "all_touched" (comparisons)
# subpixel_samples =            # s for s x s sampling; only used by "sampled"
cache = false                   # true: save kernels and reuse them in later runs with the same template,
                                # rotations, spacings, pixel size and coverage (saves ~20 s per run)
cache_dir = ".cache/kernels"    # relative to the project root; git-ignored

[spacing]                       # §6-7: row width = distance between neighbouring rows (the tractor lane)
# The search range is fixed before the run. Both ends are searched:
# min_m, min_m + step_m, ..., max_m. (max_m - min_m) must be a whole number
# of steps, otherwise the run refuses to start.
nominal_m = 2.0                 # d0, the expected spacing
min_m = 1.80
max_m = 2.20
step_m = 0.02                   # 1 % of d0 -> 21 options
# Each extra option adds a full search (180 rotations x every translation) per centre.

[rotation]                      # §7: axial, 0..179 deg
start_deg = 0
stop_deg = 180                  # exclusive
step_deg = 1

[translation]                   # §7
# The increment is not configurable: it equals the analysis raster's pixel size per axis.
# box =                         # OPEN: "tested_d" (box side = tested spacing) or "nominal_d0"
order = "centre_outward"        # ordering only; every offset is still evaluated

[centres]                       # §7: centres sit on pixel centres of the analysis raster
# spacing_m =                   # OPEN: favour dense placement

[centroid_pretest]              # §7: cheaper search, narrowed by a pre-test near each block's centroid
# A box on the centroid is searched in full (every phase, all rotations, all
# spacings). If it is weak (best score below accept_min), rings of neighbouring
# boxes around it are tested the same way, one ring at a time, spaced like the
# grid centres. The first accepted box sets the pre-test. The grid search then
# keeps every phase but only the rotations and spacings near the pre-test.
# Blocks whose centroid lies outside the polygon, or with no accepted box within
# neighbour_rings, get the full grid search.
enabled = false                 # false = full grid search everywhere (the agreed baseline)
theta_window_deg = 10.0         # grid rotations within +/- this of the pre-test direction
spacing_window_frac = 0.10      # grid spacings within +/- this fraction of the pre-test spacing
neighbour_rings = 3             # rings of neighbouring boxes tried when the centroid box is weak (0 = none)

[scoring]                       # §8
accept_min = 0.50               # tentative; overlap score, not a probability
# normalisation =               # OPEN: "renormalise_valid" (mean over valid pixels) | "full_kernel"
# min_valid_coverage =          # OPEN: a band below this valid coverage is unavailable
# unavailable_bands =           # OPEN: "renormalise" (drop their weight) | "zero" (count as 0)

[selection]                     # §9, §15: which scored hypothesis a centre reports (peak selection)
# method =                      # OPEN: "best" (unconstrained winner) | "orientation_consensus"
# consensus_radius_m =          # orientation_consensus: neighbours averaged for the local direction
# consensus_window_deg =        # orientation_consensus: allowed difference from that direction

[seeds]                         # §10 step 2
# lines =                       # OPEN: template lines that become seeds, e.g. [0] or [-1, 0, 1]
# min_band_mean =               # OPEN: a line's own evidence m_k needed to become a seed; 0 = none

[reconstruction]                # §10
growth_step_m = 1.0             # "up to 1 m initially"
min_curvature_radius_m = 5.0    # approximate scope assumption (5-10 m); sets the turn per step
# link_angle_deg =              # OPEN: seeds on one row differ by at most this angle
# link_lateral_frac =           # OPEN: ... and sit at most this fraction of d apart across the row
# link_along_m =                # OPEN: ... and at most this far apart along the row
# chain_smoothing_m =           # OPEN: across-row smoothing window along a chain; 0 = none
# growth_min_score =            # OPEN: template score that counts as support during growth
# max_gap_m =                   # OPEN: unsupported (bridged) growth allowed before an end stops
# bridge_tangent_m =            # OPEN: bridging goes straight along the row direction over this length
# join_distance_frac =          # OPEN: free ends closer than this fraction of d may join
# join_angle_deg =              # OPEN: ... when they face each other within this angle
# max_row_length_m =            # OPEN: growth safeguard per endpoint

[validation]                    # §11: final-geometry range, separate from [spacing]
spacing_min_m = 1.5
spacing_max_m = 2.5
# tolerance_m =                 # OPEN: boundary / containment tolerance
sample_step_m = 1.0             # spacing check sample interval along each row

[review]                        # §11: when a row is flagged for human review (review = 1)
# Checks never remove or fail a row. They are reported as attributes on each
# line; these thresholds only decide the review flag and the confidence class.
# Dangling ends, crossings, self-intersections and leaving the block always flag.
max_bridged_m = 15.0            # bridged (unsupported) length above this flags the row
max_bridged_frac = 0.3          # ... or bridged share of the row above this
max_spacing_out_frac = 0.25     # share of spacing samples outside the validation range
min_support_frac = 0.5          # share of 1 m samples along the row with template support
min_length_m = 4.0              # shorter rows are flagged

[storage]                       # §7: score surfaces
# surfaces =                    # OPEN: "all" | "winning_spacing" | "none"

[smoothing]                     # §10: maximum direction change between row vertices
# While any vertex of a row turns by more than max_turn_deg, the sharpest one is
# removed (never the two ends). This removes spikes and lines that double back
# and caps jitter. With vertices ~1 m apart, 20 deg is a ~2.9 m curve radius, so
# curves within the 5-10 m radius assumption are kept. Applies to estimated rows too.
enabled = true
max_turn_deg = 20.0

[missing_row_estimate]          # §10: add rows the image did not show, between rows too far apart
# The block's median row width d comes from the measured distances between its
# detected rows (a distance spanning several row intervals is divided by their
# number first). Neighbouring rows further apart than d * (1 + gap_tolerance_frac)
# get round(gap / d) - 1 rows in between, interpolated between the two
# neighbours every station_factor * d along the row so they follow its
# curvature. Added rows get estimated = 1 and review = 1 in rows.shp.
# Needs complete rows: turning this on also turns on [export] drop_hanging_rows.
enabled = false
gap_tolerance_frac = 0.50       # neighbours within d +/- 50 % are correctly spaced (rows may drift)
whole_row_tolerance_frac = 0.20 # whole-number check: a filled gap's new spacing must be within d +/- 20 %;
                                # it only rejects gaps near 1.5, 2.5, ... rows. 0.25 or more accepts every gap
station_factor = 5.0            # interpolation stations every 5 x d along the row
max_missing_rows = 3            # at most this many rows are added into one gap; wider gaps are only reported
# Squash: removed hanging pieces that lie on an estimated row are merged into it;
# the row then follows the detected piece wherever one covers it (conf = merged).
merge_pieces = true
merge_buffer_frac = 0.5         # buffer half-width: 0.5 x row width each side catches drift, never the next row
merge_min_inside_frac = 0.8     # at least 80 % of a piece must lie inside the buffer
merge_max_angle_deg = 10.0      # and run within 10 deg of the estimated row

[row_numbering]                 # §10: number the rows of each block (row_no in rows.shp)
# Transects across the rows (through every row's midpoint, plus one every
# transect_interval_m along the block) give each pair of neighbouring rows the
# number of row intervals between them; numbers follow from those relations.
# A missing row leaves a skipped number. A row whose neighbours disagree on its
# number (e.g. it drifts into the next lane) gets row_no_ok = 0 and review = 1.
# Numbers increase to the left when facing along the rows (northward for rows
# running east-west). Works best on complete rows: use it with the estimate.
enabled = false
transect_interval_m = 10.0

[export]                        # §13
shapefile = true
geopackage = true               # optional convenience copy with every layer
overlay = true                  # PNG of imagery, blocks, rows by confidence, bridges and issues
drop_hanging_rows = false       # true: keep only rows that meet their block boundary at exactly two
                                # points, their two ends. Dangling rows and rows touching the boundary
                                # elsewhere are removed before the checks and written to removed.shp
                                # instead, for adding missing rows by hand. false: keep every row.
