# Centroid pre-test, kernels built every run.
#
# The full settings for the first test data: the RGB/NIR/NDVI rasters in
# dof/bordeaux/ (git-ignored, see PROJECT.md §14) with the hand-drawn blocks in
# poly/poly.gpkg. Merged on top of configs/default.toml.
#
# Variants that extend this file:
#   centroid-pretest-cache.toml   the same, with the kernel cache on
#   full-search.toml              the same, without the pre-test (the agreed baseline)
#
# Keys marked PICK are first-run experimental choices for OPEN items
# (PROJECT.md §15), chosen 2026-11-07. They are starting points to compare,
# not validated values. (This file was configs/bordeaux.toml until 2026-11-08.)

[input]
rgb = "dof/bordeaux/rgb.tif"
nir = "dof/bordeaux/nir.tif"
# Assumed band orders. The files do not record them (see README.md).
rgb_bands = ["red", "green", "blue"]
nir_bands = ["nir", "red", "green"]
# 255 is the files' NoData value. It is also treated as an outlier value:
# vegetation never reaches 255 in any band, so 255 pixels are water glint,
# white roofs and similar. 955 pixels (0.024 %) of the scene are masked.
nodata_value = 255
nodata_rule = "any_band"
# NDVI supplied by the user. It equals (NIR - red) / (NIR + red) from nir.tif
# band 1 and rgb.tif band 1 (correlation 1.0), which also confirms the band orders above.
ndvi = "dof/bordeaux/ndvi.tif"

[vineyards]
source = "poly/poly.gpkg"       # 7 hand-drawn blocks; a fixture standing in for classification

[evidence]
method = "black_tophat"         # PICK: rows are thin dark lines on bare soil; the top-hat keeps
                                # them and removes soil-brightness patches better than a plain stretch
tophat_size_m = 1.4             # PICK: about one row spacing (7 px)
scale_region = "per_block"      # PICK: scaling over all blocks let the high-contrast block 1 set the
                                # scale, so block 0 accepted 234 centres instead of 545 on its own.
                                # Per block, a block's result no longer depends on the other blocks.
ndvi_weight = 0.0               # PICK: tested 2026-11-07 (PROJECT.md §18). At 0.3, both NDVI methods
                                # gave shorter, more broken rows than RGB alone: the NDVI is softer than
                                # the RGB at 0.2 m. To try it: ndvi_weight = 0.3, ndvi_method = "stretch".
ndvi_method = "stretch"         # used only when ndvi_weight > 0

[kernels]
cache = false                   # kernels are built every run; centroid-pretest-cache.toml turns the cache on

[template]
line_length_m = 2.0             # PICK: longer than 1 m for a steadier 1-degree orientation estimate
band_width_px = 3               # PICK: about the width of a row stripe in the evidence (0.6-0.8 m).
                                # With 1 px the score is flat across the stripe, so neighbouring
                                # centres placed the same row up to ~0.6 m apart (block 0 trial)

[spacing]
# Rows look about 1.45 m apart (search on block 0). This range brackets the
# earlier 1.3-1.5 m estimate by 0.1 m on each side: 1.20, 1.22, ..., 1.60 m = 21 options.
nominal_m = 1.4
min_m = 1.20
max_m = 1.60
step_m = 0.02

[translation]
box = "nominal_d0"              # PICK: every spacing gets the same 7 x 7 translations. With "tested_d"
                                # d = 1.60 m gets 8 x 8 and the larger max over more positions
                                # pulled 10 % of centres onto that range edge (block 0 trial).

[centres]
spacing_m = 2.0                 # PICK: ~1.4 rows apart; with seed lines -1..1 every row gets seeds

[centroid_pretest]
enabled = true                  # user request (2026-11-08): centroid pre-test, then a narrowed grid search;
                                # windows and neighbour rings as in default.toml

[scoring]
normalisation = "renormalise_valid"  # PICK: missing pixels are not read as soil
min_valid_coverage = 0.5        # PICK
unavailable_bands = "renormalise"    # PICK: edge templates are not penalised for bands outside the block

[selection]
method = "orientation_consensus"  # PICK: 17 % of raw winners in block 0 were off the 40 deg rows,
                                # scoring barely above the 40 deg hypothesis at the same centre
consensus_radius_m = 6.0        # PICK: ~3 centres each way
consensus_window_deg = 5.0      # PICK

[seeds]
lines = [-1, 0, 1]              # PICK: centre and inner lines; outer lines carry only 0.05 weight
min_band_mean = 0.4             # PICK: drops inner-line seeds on inter-row soil (about a quarter
                                # of the seeds below 0.4 in block 0 sat half a row off)

[reconstruction]
link_angle_deg = 10.0           # PICK
link_lateral_frac = 0.25        # PICK: 0.36 m at d = 1.45 m; neighbouring rows are a full d apart
link_along_m = 4.0              # PICK: twice the centre spacing
chain_smoothing_m = 4.0         # PICK: removes wobble from seeds that disagree by a pixel or two
growth_min_score = 0.4          # PICK: below the 0.50 acceptance threshold; growth only has to confirm a
                                # row it is already following, through fainter patches
max_gap_m = 50.0                # PICK: bridge faint patches (user decision 2026-11-07); bridged
                                # length is reported per row and as its own layer
bridge_tangent_m = 10.0         # PICK: direction for bridging from the last 10 m of the row
join_distance_frac = 0.35       # PICK: 0.5 m at d = 1.45 m
join_angle_deg = 20.0           # PICK
max_row_length_m = 1000.0       # PICK: safeguard only; the scene is 400 m wide

[validation]
# Final-geometry spacing check (§11). The default 1.5-2.5 m would reject
# most of these rows, so it matches the search range for now.
spacing_min_m = 1.2
spacing_max_m = 1.6
tolerance_m = 0.3               # PICK: well inside the ~1 m accuracy target

[storage]
surfaces = "winning_spacing"    # PICK: "all" would be about 6 GB per run here; this keeps
                                # every translation x rotation surface of each centre's winning spacing
