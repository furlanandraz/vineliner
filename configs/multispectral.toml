# Multispectral drone layers: RGB, NIR and NDVI together.
#
# The same method as centroid-pretest-cache-row-estimate-numbering.toml (pre-test,
# kernel cache, missing-row estimate with squash, row numbering), on the Cremons
# DJI flight of 2025-08-22 in dof/cremons/ (git-ignored, see PROJECT.md §14).
# Its block is the user's polygon in poly/cremons.gpkg. Outputs go to runs/cremons/.
#
# The layers are prepared from the DJI Terra mosaics (EPSG:4326, 0.7-1.2 cm) onto one
# 0.20 m grid in RDN2008 / UTM zone 33N (EPSG:6708), the CRS of the FVG regional data:
#   python src/prepare_inputs.py dof/cremons --crs EPSG:6708 --pixel 0.20 \
#       --layer rgb  <flight>/map/result.tif 1 2 3 --layer nir <flight>/map/result_NIR.tif \
#       --layer ndvi <flight>/map/index_map/NDVI.tif --layer gndvi <flight>/map/index_map/GNDVI.tif
#
# Compare layers without editing this file, e.g.
#   python src/run_pipeline.py configs/multispectral.toml --layers ndvi --name ndvi
# Keys marked PICK are first-run choices for this area (2026-11-12), not validated values.
extends = "centroid-pretest-cache-row-estimate-numbering.toml"

[input]
rgb = "dof/cremons/rgb.tif"
rgb_bands = ["red", "green", "blue"]  # DJI result.tif bands 1-3 (band 4, alpha, is dropped)
nir = "dof/cremons/nir.tif"
nir_bands = ["nir"]             # DJI result_NIR.tif: one float reflectance band
ndvi = "dof/cremons/ndvi.tif"   # DJI index_map/NDVI.tif; matches (NIR - red) / (NIR + red) with r = 0.999
nodata_value = 0                # the RGB file's NoData. It replaces the 255 inherited from Bordeaux, which would
                                # leave the RGB NoData unmasked. The NIR and NDVI NoData is NaN, masked anyway

[vineyards]
source = "poly/cremons.gpkg"    # the user's polygon, moved from the June flight's local frame (PROJECT.md §14)
id_field = "id"

[evidence]
# Row contrast measured in 18 patches over the block (PROJECT.md §14): NIR 1.9, NDVI 1.7,
# GNDVI 1.8, RGB gray 0.8. Weights are relative over the layers in use.
rgb_weight = 1.0                # PICK: first run, equal shares
nir_weight = 1.0                # PICK
ndvi_weight = 1.0               # PICK
method = "black_tophat"         # RGB: rows are darker than the grassed inter-rows, as at Bordeaux
tophat_size_m = 1.4             # PICK: as Bordeaux; 1.4-2.0 m measured alike
nir_method = "white_tophat"     # PICK: canopy is bright in NIR. A stretch gives the same median contrast, but the
nir_tophat_size_m = 1.4         # top-hat is better in the worst patch, where it flattens the bright verge trees
ndvi_method = "white_tophat"    # PICK: the grassed inter-rows are green too, so the top-hat keeps only narrow rows
ndvi_tophat_size_m = 1.4        # PICK

[spacing]
# Rows are 2.57-2.64 m apart (across-row NIR profiles, PROJECT.md §14): 2.40, 2.42, ..., 2.80 m = 21 options.
nominal_m = 2.6
min_m = 2.40
max_m = 2.80
step_m = 0.02

[validation]
spacing_min_m = 2.4             # the search range, as for Bordeaux
spacing_max_m = 2.8

[export]
runs_dir = "runs/cremons"
