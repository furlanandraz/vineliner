[build-system]
requires = ["setuptools>=77"]  # 77: SPDX licence expressions (PEP 639)
build-backend = "setuptools.build_meta"

# Development environment for the QGIS plugin in vineliner/. QGIS loads the
# plugin folder directly and does not use this file; it is here so the core's
# tests run outside QGIS (python -m pytest).
[project]
name = "vineliner"
version = "0.2.0"  # keep equal to vineliner/metadata.txt and vineliner/core/__init__.py (checked by a test)
description = "QGIS plugin: vineyard rows from aerial and drone imagery as lines."
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The core needs only these; QGIS 3.40+ ships all three with its Python on Windows.
dependencies = ["numpy", "scipy", "shapely>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vineliner*"]

[tool.setuptools.package-data]
"vineliner.core" = ["defaults.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--import-mode=importlib"
